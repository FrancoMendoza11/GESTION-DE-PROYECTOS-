<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Estudio - Gestión de Proyectos</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ecf0f1;
            --accent-color: #3498db;
            --card-bg: #fff;
            --card-border: #e0e0e0;
            --hover-bg: #e8f4f8;
            --quote-bg: #f9f9f9;
        }

        .dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --sidebar-bg: #0f3460;
            --sidebar-text: #e0e0e0;
            --accent-color: #e94560;
            --card-bg: #16213e;
            --card-border: #0f3460;
            --hover-bg: #1a1a2e;
            --quote-bg: #0f3460;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }

        /* --- ESTILOS DESKTOP --- */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            transition: background-color 0.3s;
            z-index: 10;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            padding: 0 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--sidebar-text);
            padding: 15px 20px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            border-left: 4px solid transparent;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--accent-color);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            z-index: 5;
        }

        .search-bar {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 400px;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .theme-toggle {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            margin-left: 10px;
        }

        .content-area {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            scroll-behavior: smooth;
        }

        /* Tarjetas y Acordeones */
        .topic-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        details {
            padding: 15px;
            cursor: pointer;
        }

        summary {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        summary::-webkit-details-marker { display: none; }
        
        summary::after {
            content: '+';
            font-size: 1.3rem;
            color: var(--text-color);
        }

        details[open] summary::after {
            content: '-';
        }

        .details-content {
            margin-top: 15px;
            line-height: 1.6;
            padding-left: 10px;
            border-left: 2px solid var(--accent-color);
            font-size: 0.95rem;
        }

        .details-content p {
            margin-bottom: 10px;
        }

        .details-content ul, .details-content ol {
            margin-left: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        .details-content li {
            margin-bottom: 8px;
        }

        /* Estilo específico para el diccionario */
        .dict-term {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--card-border);
        }
        .dict-term:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .dict-term strong {
            color: var(--accent-color);
            display: block;
            margin-bottom: 5px;
            font-size: 1.05rem;
        }

        .highlight {
            background-color: rgba(52, 152, 219, 0.2);
            padding: 10px;
            border-radius: 5px;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
        }
        
        .formula {
            background-color: #e8f4f8;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            margin: 10px 0;
            color: #2c3e50;
            border: 1px solid #bce8f1;
        }

        blockquote {
            background-color: var(--quote-bg);
            padding: 10px;
            border-left: 4px solid var(--accent-color);
            font-style: italic;
            margin: 10px 0;
            border-radius: 0 5px 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid var(--card-border);
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        th { background-color: var(--hover-bg); }

        /* --- ESTILOS MOBILE (Celulares y Tablets) --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                padding: 10px 0;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
                white-space: nowrap;
            }
            
            .sidebar::-webkit-scrollbar { display: none; }

            .sidebar h2 { display: none; }

            .nav-menu {
                flex-direction: row;
                padding: 0 10px;
            }

            .nav-btn {
                padding: 10px 15px;
                width: auto;
                border-left: none;
                border-bottom: 3px solid transparent;
                font-size: 0.9rem;
                border-radius: 20px;
            }

            .nav-btn:hover, .nav-btn.active {
                border-left: none;
                border-bottom: 3px solid var(--accent-color);
                background-color: transparent;
            }

            .main-content { overflow: visible; }

            header {
                flex-direction: row;
                padding: 10px 15px;
                position: sticky;
                top: 0;
            }

            .search-bar {
                font-size: 0.9rem;
                padding: 8px 12px;
            }

            .theme-toggle {
                padding: 8px 12px;
                font-size: 0.9rem;
            }

            .content-area {
                padding: 15px;
                overflow-y: visible;
            }
            
            .formula { font-size: 0.9rem; }
        }
    </style>
</head>

                            <p class="highlight">La reingeniería es el rediseño radical de un proceso o sistema existente. No implica ignorar lo que ya hay (de hecho, comienza analizando el inventario y recuperando el diseño del sistema viejo), sino que busca <b>reconstruir su solución desde cero</b>, descartando las prácticas obsoletas para lograr mejoras dramáticas en su rendimiento.</p>

                                "En lugar de incrustar procesos caducos en silicio y software, debemos eliminarlos y comenzar de nuevo. Debemos 'reingeniar' nuestras empresas usando el poder de la tecnología para <b>rediseñar radicalmente</b> los procesos empresariales para lograr <b>mejoras dramáticas</b> en su rendimiento."

                            <p>Las <b>Leyes de evolución del software (Meir M. Lehman)</b> establecen que:</p>

                                <li><b>Soportabilidad:</b> Dar soporte implica todas las tareas requeridas para mantener en adecuado funcionamiento el producto liberado.</li>

                        `
                    },
                    {

                            <ol>
                                <li><b>Análisis de inventario:</b> Lista con descripción detallada de cada producto de software activo (funciones, impacto, fecha de lanzamiento, tamaño, importancia, mantenibilidad y soportabilidad).</li>
                                <li><b>Reestructuración de documentos:</b> Revisión y reformulación (o creación) de la documentación existente. Ajustarla a medida que se realicen actualizaciones.</li>
                                <li><b>Ingeniería Inversa:</b> Proceso de recuperación del diseño analizando el programa para construir una representación del mismo con un nivel de abstracción superior.</li>
                                <li><b>Reestructuración de código:</b> El código fuente se revisa y re-estructura para que produzca la misma o más funcionalidad con más y mejor calidad. Eventualmente se codifica en otro lenguaje.</li>
                                <li><b>Reestructuración de datos:</b> La arquitectura de datos existente se diseca y se reformulan los modelos. Se identifican objetos reestructurando atributos.</li>

                            <ul>
                                <li><b>Bajo:</b> Diseño procedimental.</li>
                                <li><b>Medio:</b> Estructura de programa y datos.</li>
                                <li><b>Alto:</b> Modelo de objetos, modelo de entidad.</li>

                            <p><b>Tareas:</b> Comprender los datos (interna: clases/variables, externa: BD), Comprender el procesamiento (abstracciones procedimentales, patrones como ABM), y Comprender las interfaces Hombre/Máquina.</p>

                            <p class="highlight">Regla de oro (Pág. 29): Se hace cuando el costo esperado de mantenimiento del producto re-ingenierizado por su vida útil + el costo propio del proceso es INFERIOR al costo esperado del mantenimiento del producto vigente por su vida útil.</p>

        function loadTopic(topicKey, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const data = apuntes[topicKey];
            const contentArea = document.getElementById('contentArea');
            
            let html = `<h1 style="margin-bottom: 20px; font-size: 1.5rem;">${data.titulo}</h1>`;

            data.temas.forEach((tema, index) => {
                html += `
                    <div class="topic-card">
                        <details ${index === 0 ? 'open' : ''}>
                            <summary>${tema.titulo}</summary>
                            <div class="details-content">
                                ${tema.contenido}
                            </div>
                        </details>
                    </div>
                `;
            });

            contentArea.innerHTML = html;
            document.getElementById('searchInput').value = '';

            if (window.innerWidth <= 768) {
                document.querySelector('.main-content').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function searchContent() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.topic-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(input)) {
                    card.style.display = 'block';
                    if(input.length > 2) {
                        card.querySelector('details').setAttribute('open', 'true');
                    }
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.onload = () => {
            loadTopic('reingenieria', document.querySelector('.nav-btn'));
        };

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor de Estudio - Gestión de Proyectos</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --sidebar-bg: #2c3e50;
            --sidebar-text: #ecf0f1;
            --accent-color: #3498db;
            --card-bg: #fff;
            --card-border: #e0e0e0;
            --hover-bg: #e8f4f8;
            --quote-bg: #f9f9f9;
        }

        .dark-mode {
            --bg-color: #1a1a2e;
            --text-color: #e0e0e0;
            --sidebar-bg: #0f3460;
            --sidebar-text: #e0e0e0;
            --accent-color: #e94560;
            --card-bg: #16213e;
            --card-border: #0f3460;
            --hover-bg: #1a1a2e;
            --quote-bg: #0f3460;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
        }

        /* --- ESTILOS DESKTOP --- */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            transition: background-color 0.3s;
            z-index: 10;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            padding: 0 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--sidebar-text);
            padding: 15px 20px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            border-left: 4px solid transparent;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: rgba(255, 255, 255, 0.1);
            border-left: 4px solid var(--accent-color);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            z-index: 5;
        }

        .search-bar {
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            width: 100%;
            max-width: 400px;
            outline: none;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
        }

        .theme-toggle {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            margin-left: 10px;
        }

        .content-area {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            scroll-behavior: smooth;
        }

        /* Tarjetas y Acordeones */
        .topic-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        details {
            padding: 15px;
            cursor: pointer;
        }

        summary {
            font-weight: bold;
            font-size: 1.05rem;
            color: var(--accent-color);
            outline: none;
            list-style: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        summary::-webkit-details-marker { display: none; }
        
        summary::after {
            content: '+';
            font-size: 1.3rem;
            color: var(--text-color);
        }

        details[open] summary::after {
            content: '-';
        }

        .details-content {
            margin-top: 15px;
            line-height: 1.6;
            padding-left: 10px;
            border-left: 2px solid var(--accent-color);
            font-size: 0.95rem;
        }

        .details-content p {
            margin-bottom: 10px;
        }

        .details-content ul, .details-content ol {
            margin-left: 20px;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        
        .details-content li {
            margin-bottom: 8px;
        }

        .highlight {
            background-color: rgba(52, 152, 219, 0.2);
            padding: 2px 4px;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .formula {
            background-color: #e8f4f8;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            font-weight: bold;
            margin: 10px 0;
            color: #2c3e50;
            border: 1px solid #bce8f1;
        }

        blockquote {
            background-color: var(--quote-bg);
            padding: 10px;
            border-left: 4px solid var(--accent-color);
            font-style: italic;
            margin: 10px 0;
            border-radius: 0 5px 5px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9rem;
        }
        th, td {
            border: 1px solid var(--card-border);
            padding: 8px;
            text-align: left;
        }
        th { background-color: var(--hover-bg); }

        /* --- ESTILOS MOBILE (Celulares y Tablets) --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
                overflow: auto;
            }

            .sidebar {
                width: 100%;
                padding: 10px 0;
                flex-direction: row;
                align-items: center;
                overflow-x: auto;
                white-space: nowrap;
            }
            
            .sidebar::-webkit-scrollbar { display: none; }

            .sidebar h2 { display: none; }

            .nav-menu {
                flex-direction: row;
                padding: 0 10px;
            }

            .nav-btn {
                padding: 10px 15px;
                width: auto;
                border-left: none;
                border-bottom: 3px solid transparent;
                font-size: 0.9rem;
                border-radius: 20px;
            }

            .nav-btn:hover, .nav-btn.active {
                border-left: none;
                border-bottom: 3px solid var(--accent-color);
                background-color: transparent;
            }

            .main-content { overflow: visible; }

            header {
                flex-direction: row;
                padding: 10px 15px;
                position: sticky;
                top: 0;
            }

            .search-bar {
                font-size: 0.9rem;
                padding: 8px 12px;
            }

            .theme-toggle {
                padding: 8px 12px;
                font-size: 0.9rem;
            }

            .content-area {
                padding: 15px;
                overflow-y: visible;
            }
            
            .formula { font-size: 0.9rem; }
        }
    </style>
</head>

                            <p><b>ERP:</b> Producto que cubre todas las operaciones. Módulos integrados. Un dato se incorpora una vez. <b>Costos Ocultos:</b> Integración con procesos, desatención de capacitación, dependencia de consultores, "Depresión post-ERP" (problemas con nueva forma de operar).</p>

                    },
                    {
                        titulo: "Estrategia IT y Porter",

                            <ul>
                                <li><b>Táctico:</b> Automatizar procesos internos, mejoras cuantitativas, centro de costos (gasto operativo).</li>
                                <li><b>Estratégico:</b> Dirigido al entorno, ventajas competitivas, centro de resultados (inversión).</li>
                            </ul>
                            <p><b>Cinco Fuerzas de Porter:</b> Nuevos Competidores (amenaza), Proveedores (poder), Clientes (poder), Productos Sustitutos (amenaza), Rivalidad (en el centro).</p>
                            <p><b>Por qué fallan los proyectos (Standish Group):</b> Escasa participación de usuarios, especificaciones incompletas, cambios frecuentes, falta de apoyo ejecutivo, incompetencia tecnológica, falta de recursos, expectativas no realistas, objetivos poco claros, cronogramas irreales, nuevas tecnologías.</p>
                            <p><b>Outsourcing:</b> Transferir a un proveedor. Claves: Tercerizar actividades seguras, investigar proveedor, flexibilidad de renegociación, mantener personal de TI.</p>

            rts: {

                    {

                            <p>Destinados a monitorear, controlar o responder a un entorno físico.</p>
                            <p><b>Definición:</b> El tiempo de entrega es tan importante como la correctitud. Consecuencias de tardanza son peligrosas.</p>
                            <ul>
                                <li><b>RTS Blando (Soft):</b> Se degrada si no cumple tiempo (ej. cámaras, streaming).</li>
                                <li><b>RTS Duro (Hard):</b> Es <b>incorrecto</b> si no cumple (ej. Airbag, ABS, aviónica).</li>

                            <p><b>Estímulos:</b> Periódicos (sensores, predecibles) y Aperiódicos (irregulares, emergencias).</p>

                            <p><b>Embebidos:</b> Forman parte de un sistema mayor. Presencia no obvia (Caja Negra). Ej: Motores, lavarropas, marcapasos. Pueden usar SO estándar (Unix), RTOS o ASIC.</p>
                            <p><b>RTOS:</b> Minimizan latencia de interrupciones y context switch. Soportan concurrencia, temporización determinista, E/S. Ej: FreeRTOS, QNX, RTLinux.</p>

                                <li><b>Naturaleza:</b> Materias Primas, Sueldos, Cargas, Otras.</li>

                            <ul>
                                <li><b>Contribución Marginal:</b> Precio Venta Neto - Costos Variables.</li>
                                <li><b>Punto de Equilibrio:</b> Costos Fijos Totales / Contribución Marginal Unitaria.</li>

        function loadTopic(topicKey, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            const data = apuntes[topicKey];
            const contentArea = document.getElementById('contentArea');
            
            let html = `<h1 style="margin-bottom: 20px; font-size: 1.5rem;">${data.titulo}</h1>`;

            data.temas.forEach((tema, index) => {
                html += `
                    <div class="topic-card">
                        <details ${index === 0 ? 'open' : ''}>
                            <summary>${tema.titulo}</summary>
                            <div class="details-content">
                                ${tema.contenido}
                            </div>
                        </details>
                    </div>
                `;
            });

            contentArea.innerHTML = html;
            document.getElementById('searchInput').value = '';

            if (window.innerWidth <= 768) {
                document.querySelector('.main-content').scrollIntoView({ behavior: 'smooth' });
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        function searchContent() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.topic-card');
            
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                if (text.includes(input)) {
                    card.style.display = 'block';
                    if(input.length > 2) {
                        card.querySelector('details').setAttribute('open', 'true');
                    }
                } else {
                    card.style.display = 'none';
                }
            });
        }

        window.onload = () => {
            loadTopic('reingenieria', document.querySelector('.nav-btn'));
        };
    </script>
